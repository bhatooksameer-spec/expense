<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/mdb-ui-kit@9.3.0/css/mdb.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

  <div class="container py-4">

    <h1 class="text-center mb-4">Expense Tracker</h1>

    <div class="row g-4">

      <!-- Form -->
      <div class="col-lg-4 col-md-5 col-12 order-1 order-lg-2">

        <div class="form">

          <div class="mb-3">
            <label class="form-label">Enter Type</label>

            <select id="type" class="form-select">
              <option value="" selected disabled>Choose Type</option>
              <option value="Income">Income</option>
              <option value="Fees">Fees</option>
              <option value="Rent">Rent</option>
            </select>

          </div>

          <div class="mb-3">
            <label class="form-label">Enter Name</label>

            <input
              type="text"
              id="name"
              class="form-control"
              placeholder="Enter Name"
            >
          </div>

          <div class="mb-3">
            <label class="form-label">Enter Amount</label>

            <input
              type="number"
              id="amount"
              class="form-control"
              placeholder="Enter Amount"
            >
          </div>

          <button class="btn btn-success w-100" onclick="addData()">
            ADD DATA
          </button>

        </div>

      </div>

      <!-- Table -->
      <div class="col-lg-8 col-md-7 col-12 order-2 order-lg-1">

        <div class="table-responsive shadow rounded">

          <table class="table table-bordered table-hover align-middle mb-0">

            <thead class="table-dark">
              <tr>
                <th>S.No.</th>
                <th>Name</th>
                <th>Amount</th>
                <th>Type</th>
                <th style="min-width:150px;">Action</th>
              </tr>
            </thead>

            <tbody id="raw">

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/mdb-ui-kit@9.3.0/js/mdb.umd.min.js"></script>

</body>
</html>
